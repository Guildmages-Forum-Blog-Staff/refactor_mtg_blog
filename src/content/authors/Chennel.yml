username: "Chennel"
name: "Chennel"
avatar: "/images/Chennel-avatar.jpeg"
intro_zh: [
  "跟著RC賽制打構築的玩家，標準、先驅、近代都玩過一輪，結果繞了一圈，還是最愛先驅（雖然沒有比賽可以打 QQ）。喜歡帶有unfair組合技的節奏套牌，特別熱愛紅藍色組。除了打牌之外，最喜歡的事情就是推坑身邊的朋友入坑，然後看著他們越買越多卡。",
  "命運的二十面骰，自擲出後從未停止轉動，今日如此，往後亦如是，它仍會不斷旋轉下去，推著我持續前行在這條道路上。"
]
intro_en: [
  "A constructed player who follows the RC formats. I've played a full round of Standard, Pioneer and Modern, and after all that I still love Pioneer the most (even though there are no events for it, QQ). I love tempo decks with unfair combos, especially Izzet. Besides playing, my favourite thing is dragging friends into the game and watching them buy more and more cards.",
  "The d20 of fate has never stopped spinning since it was first rolled. So it is today, and so it will be; it keeps turning, pushing me onward along this road.",
]
