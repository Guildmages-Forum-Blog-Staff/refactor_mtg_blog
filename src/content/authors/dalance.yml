intro_en: [
  "A gaming nomad who loves wandering between all kinds of games and enjoying each one. After a full lap I found I still love MTG and Richard Garfield the most. I usually play Draft, Standard and Pioneer on Arena. After discovering Cube I decided to stay a while and see what sparks fly.",
