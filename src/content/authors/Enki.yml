intro_zh: [
  "專攻構築賽的賽場玩家，標準、先驅和近代賽制皆有涉略。",
  "擅長打中速和偏控制類的套牌，打法相當保守（隨時都覺得對面要開搞）。",
  "對多色主題情有獨鍾，尤其是五色構築，也經常用這些套牌參賽。"
]
intro_en: [
  "A tournament player focused on constructed, playing Standard, Pioneer and Modern.",
  "Best at midrange and control-leaning decks, with a very cautious playstyle (always convinced the opponent is about to go off).",
  "Has a soft spot for multicolour themes, especially five-colour decks, and often brings them to events.",
]
