intro_zh: [
  "斯翠海文入坑的構築玩家，前兩年以標準為主，現階段多關注近代與先驅的永久賽制。種族套牌愛好者！也是極限快攻的愛好者！最喜歡的單卡是 <a href='https://cards.scryfall.io/large/front/8/3/8351efc5-a392-4ec8-877f-15d5b3dc0929.jpg?1562790075'>神器緘靈</a> 跟 <a href='https://cards.scryfall.io/large/front/7/c/7c0aaec8-49de-4ac6-b9d8-b3354a87dcf5.jpg?1562924226'>執政院無畏艦</a>。<br/><br/>",
  "目標是收藏M15新牌框以後的標準系列全部各4張，以及所有標準系列旅法師各一張！"
]
intro_en: [
  "A constructed player who joined during Strixhaven. Mainly played Standard for the first two years, now focused on the eternal formats Modern and Pioneer. A tribal deck enthusiast — and an all-in aggro enthusiast too! Favourite cards are <a href='https://cards.scryfall.io/large/front/8/3/8351efc5-a392-4ec8-877f-15d5b3dc0929.jpg?1562790075'>Ensoul Artifact</a> and <a href='https://cards.scryfall.io/large/front/7/c/7c0aaec8-49de-4ac6-b9d8-b3354a87dcf5.jpg?1562924226'>Consulate Dreadnought</a>.<br/><br/>",
  "Goal: collect a playset of every card from every Standard set since the M15 frame, plus one of every planeswalker from those sets!",
]
