name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * 0' # every Monday 00:00 UTC+8 (Sunday 16:00 UTC)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Restore Scryfall card cache so prebuild only fetches deltas instead of
      # all ~3800 cards from scratch each run. Primary key changes whenever any
      # post or the prebuild script does; restore-keys grabs the most recent
      # cache for warm starts on cache-miss. actions/cache@v5 auto-saves at end
      # of job iff primary key was missed (i.e. posts or the script changed
      # since last successful build). Hashing the script captures CACHE_SCHEMA
      # bumps and retry-logic changes so we don't silently reuse stale shapes.
      - name: Restore Scryfall cache
        uses: actions/cache@v5
        with:
          path: .cache/cards.json
          key: scryfall-cache-${{ hashFiles('src/content/posts/**', 'scripts/build-card-cache.ts') }}
          restore-keys: |
            scryfall-cache-

      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: '22'
          # Disable withastro/action's Astro cache (`node_modules/.astro/`,
          # the cache-dir input): Content Layer data-store, optimized
          # images, and other build artefacts. The action's cache key is
          # derived from a digest of the astro.config object, which
          # collapses function bodies (i.e. remark/rehype plugin
          # internals) to opaque [Function] tokens — so editing a plugin
          # without touching astro.config.ts leaves the digest stable and
          # the action's restore-keys fallback would reuse the previous
          # build's pre-rendered HTML, shipping output that does not
          # reflect the plugin change. Turning the cache off forces a
          # cold render every CI run; the trade-off is one extra markdown
          # + asset pipeline pass per build, which on a site this size is
          # acceptable for correctness.
          #
          # Out of scope: setup-node's package-manager cache (independent
          # of `cache:` here, used for installing node_modules) and the
          # workflow-level Scryfall .cache/cards.json restore above —
          # both remain active.
          cache: 'false'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
