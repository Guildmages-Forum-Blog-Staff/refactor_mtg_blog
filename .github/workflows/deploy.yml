name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1' # every Monday 02:00 UTC (10:00 Taipei)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Restore Scryfall card cache so prebuild only fetches deltas instead of
      # all ~3800 cards from scratch each run. Primary key changes whenever any
      # post does; restore-keys grabs the most recent cache for warm starts on
      # cache-miss. actions/cache@v5 auto-saves at end of job iff primary key
      # was missed (i.e. posts changed since last successful build).
      - name: Restore Scryfall cache
        uses: actions/cache@v5
        with:
          path: .cache/cards.json
          key: scryfall-cache-${{ hashFiles('src/content/posts/**') }}
          restore-keys: |
            scryfall-cache-

      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: '22'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
