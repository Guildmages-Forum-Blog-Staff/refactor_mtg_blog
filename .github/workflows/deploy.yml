name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1' # every Monday 02:00 UTC (10:00 Taipei)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    outputs:
      cache_updated: ${{ steps.cache_check.outputs.updated }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install, build, and upload your site
        uses: withastro/action@v2
        with:
          node-version: '22'

      - name: Check if Scryfall cache was updated
        id: cache_check
        run: |
          if ! git diff --quiet .scryfall-cache.json; then
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated Scryfall cache
        if: steps.cache_check.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .scryfall-cache.json
          git commit -m "chore: update scryfall cache [auto]"
          git push

  deploy:
    needs: build
    if: needs.build.outputs.cache_updated != 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
